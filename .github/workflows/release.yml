name: Release

# Run manually from the Actions tab: "Release" > "Run workflow", enter a tag such as v0.1.0.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: gradle clean build
        run: gradle clean build --stacktrace --console=plain
      - name: Publish release (only reached if the build succeeded)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          test -s "$JAR"
          gh release create "${{ github.event.inputs.tag }}" "$JAR" --title "RAVEX AI Civilization ${{ github.event.inputs.tag }}" --notes-file CHANGELOG.md
